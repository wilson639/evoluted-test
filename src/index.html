<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evoluted Test</title>
  </head>
  <body>

    <section class="hero-banner mb-4 mb-md-5">
      <img src="/src/img/banner.png" alt="SpaceX launch" class="hero-banner-img"/>
      <div class="hero-banner-text h-100 d-flex justify-content-center align-items-center">
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-6 mx-auto">
              <img src="/src/img/spacex.svg" alt="SpaceX logo" class="hero-banner-logo mx-auto my-3 my-sm-4"/>
              <h1 class="h2 text-center mb-0">Launch Manifest</h1>
            </div>  
          </div>
          </div>
        </div>
      </div>
    </section>

    <section class="container">
      <div class="row d-flex justify-content-center mb-4 mb-md-5">
        <div class="col-md-4">        
          <select id="launch-select" class="form-select form-select-lg" aria-label="Select launch year" disabled>
            <option selected>All</option>  
          </select>
        </div>
      </div>
      <div class="row">
        <ul id="launch-info" class="d-flex flex-row flex-wrap"></ul>
      </div>
    </section>

    <footer class="py-5">
      <div class="container">
        <div class="row">
          <div class="col-sm-4 col-lg-2 mb-4 mb-lg-0 ">
            <img src="/src/img/spacex.svg" alt="SpaceX logo" class="pt-sm-2"/>
          </div>
          <div class="col-sm-8 col-lg-7 mb-4 mb-lg-0">This page displays information taken from the unofficial <a href="https://github.com/r-spacex/SpaceX-API" target=”_blank”>SpaceX REST API</a> which is not affiliated or endorsed by Space Exploration Technologies Corp (SpaceX).</div>
          <div class="col-lg-3 text-lg-end"><a href="https://github.com/wilson639/evoluted-test" target=”_blank”>View source</a></div>
        </div>
      </div>
    </footer>

  </body>
</html>
